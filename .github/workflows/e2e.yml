name: E2E Scenario

# 実サーバー(Spigot 1.14.4 + 依存プラグイン)で試合を1つ通すシナリオテスト。
# Normal / TDM / TDMLong / Area を matrix で並列に回す。
#
# 事前に Spigot を1回だけビルドして ~/.m2 をキャッシュし、各シナリオはそれを復元して使う
# (BuildTools は 1 回 10〜20 分かかるため、matrix の各ジョブで回すと現実的でない)。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/e2e.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  MC_VERSION: '1.14.4'
  PNPM_VERSION: '12.10.1'

jobs:
  spigot:
    name: Build Spigot 1.14.4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Cache .m2 (Spigot artifact)
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: spigot-${{ env.MC_VERSION }}-m2-v1
          restore-keys: |
            spigot-${{ env.MC_VERSION }}-m2-

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'adopt'
          java-version: '11'

      - name: Build Spigot with BuildTools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          wget -q "https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar"
          # BuildTools は git のユーザー設定を要求するので、グローバル設定は触らず env で渡す
          GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@example.com \
          GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@example.com \
          java -jar BuildTools.jar --rev "$MC_VERSION" --nogui

  e2e:
    name: scenario (${{ matrix.mode }})
    needs: spigot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode: [Normal, TDM, TDMLong, Area]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'adopt'
          java-version: '11'

      - name: Restore Spigot from cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: spigot-${{ env.MC_VERSION }}-m2-v1
          restore-keys: |
            spigot-${{ env.MC_VERSION }}-m2-

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: e2e/scenario/pnpm-lock.yaml

      - name: Install bot dependencies
        working-directory: e2e/scenario
        run: pnpm install --frozen-lockfile

      - name: Run scenario
        env:
          WORK_MODE: ${{ matrix.mode }}
        run: bash e2e/run.sh --work-mode "$WORK_MODE"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-${{ matrix.mode }}
          path: |
            e2e/.run/report.json
            e2e/.run/server.log
          if-no-files-found: warn
